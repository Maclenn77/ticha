[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.bumpver]
current_version = "0.2.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"'
]
"src/ticha/__init__.py" = [
    '__version__ = "{version}"'
]

[project]
name = "ticha"
version = "0.2.0"
description = "Web scraper for Ticha Colonial Zapotec manuscript data"
readme = "README.md"
license = "MIT"
authors = [
    {name = "J. P. Péreztejada", email = "maclenn77@gmail.com"},
]
keywords = ["zapotec", "manuscripts", "web scraping", "pandas", "digital humanities"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0,<3.0.0",
    "selenium>=4.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.15.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
lines = [
    "kraken>=6.0,<8",
    "rapidfuzz>=3.0",
    "huggingface_hub>=0.20,<2",  # fine-tuned alignment model; 2.x needs click>=8.4, kraken 7.1 needs <8.3
]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/maclenn77/ticha"
Repository = "https://github.com/maclenn77/ticha.git"
Issues = "https://github.com/maclenn77/ticha/issues"

[project.scripts]
ticha-scraper = "ticha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
select = ["E", "F", "B", "SIM", "I"]
line-length = 88
target-version = "py39"
