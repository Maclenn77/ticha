# Conda environment for the Ticha HTR dataset pipeline (notebooks/ticha_pipeline.ipynb).
# The notebook imports the code from src/ directly, so the ticha package is not installed.
#
#   conda env create -f environment.yml
#   conda activate ticha
#   python -m ipykernel install --user --name ticha --display-name "Python (ticha)"
#
# See ENVIRONMENT.md for details.
name: ticha
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # scraping
  - pandas>=1.5,<3
  - requests>=2.28
  - beautifulsoup4>=4.15
  - selenium>=4.0          # manuscript list only; needs Google Chrome installed
  # images / augmentation
  - pillow>=9.0
  - numpy
  # line pairing
  - rapidfuzz>=3.0
  # notebook
  - jupyterlab
  - ipykernel
  # tests
  - pytest>=7.0
  - pytest-mock>=3.10
  - pip:
      # kraken (segmentation + HTR) pulls PyTorch from PyPI, which has the
      # Apple Silicon (MPS) and CUDA builds.
      - kraken==7.1.1
      # downloads the fine-tuned alignment model from the Hugging Face Hub
      - huggingface_hub>=0.20,<2  # 2.x needs click>=8.4, which kraken 7.1.1 rejects
